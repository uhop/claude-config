name: Pull request checks
permissions:
  contents: read

on:
  pull_request:
    branches: ['main']

jobs:
  checks:
    name: Style check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: latest
      - run: npx -y prettier --check .
